# agent-grid tmux defaults. Loaded from ~/.tmux.conf; your own lines there override these.

# ---- Behavior ----
set -g mouse on
set -g focus-events on
set -as terminal-features ",xterm*:RGB"

# ---- Keys (prefix is Ctrl+b) ----
# A: spawn picker starting from this pane's folder (G: same, with --gh)
# O: overview of every agent (status + live preview, Enter jumps)
# W: watch this pane's manager live, in a split
# M: send a message to agents
# The pane labeled "manager" shows the manager's live feed.
# S: send typing to every pane (toggle)
# K: kill the whole session (asks first)
bind A display-popup -E -w 80% -h 70% -d "#{pane_current_path}" '$HOME/.local/bin/spawn'
bind G display-popup -E -w 80% -h 70% -d "#{pane_current_path}" '$HOME/.local/bin/spawn --gh'
bind O display-popup -E -w 90% -h 85% '$HOME/.local/bin/spawn --overview'
bind M display-popup -E -w 80% -h 60% '$HOME/.local/bin/spawn --send'
bind W split-window -h -l 45% -c "#{pane_current_path}" "$HOME/.local/bin/spawn --watch '#{pane_current_path}'"
bind S setw synchronize-panes
bind K confirm-before -p "Kill all agents? (y/n)" kill-session
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ---- Look (One Dark) ----
set -g status-style "bg=#21252b,fg=#abb2bf"
set -g status-left-length 20
set -g status-left "#[bg=#61afef,fg=#282c34,bold] #S #[default] "
set -g status-interval 5
set -g status-right-length 80
set -g status-right "#[fg=#e5c07b,bold]#($HOME/.local/bin/spawn --summary)#[default]#[bg=#3e4452,fg=#abb2bf] %a %b %d  %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#98c379,fg=#282c34,bold] #I #W "
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"
set -g pane-border-format " #{?pane_active,#[fg=#61afef],#[fg=#5c6370]}#{?@label,#{@label},#{b:pane_current_path}}#{?@autopush, #[fg=#98c379][auto-push],}#{?@review, #[fg=#c678dd][managed],}#{?#{==:#{@status},setup}, #[fg=#c678dd][setting up checks],}#{?#{==:#{@status},setup-ready}, #[fg=#e5c07b]#[bold][checks ready: your turn],}#{?#{==:#{@status},waiting}, #[fg=#e5c07b]#[bold][needs you],}#{?#{==:#{@status},failed}, #[fg=#e06c75]#[bold][checks failed],}#{?#{==:#{@status},checking}, #[fg=#c678dd][checking],}#{?#{==:#{@status},reviewing}, #[fg=#c678dd][manager testing],}#{?#{==:#{@status},queued}, #[fg=#c678dd][manager queued for Excel],}#{?#{==:#{@status},flagged}, #[fg=#e06c75]#[bold][manager flagged],}#{?#{==:#{@status},working}, #[fg=#61afef][working],}#{?#{==:#{@status},done}, #[fg=#98c379][done],} "
set -g window-style "bg=#21252b"
set -g window-active-style "bg=#282c34"
set -g message-style "bg=#61afef,fg=#282c34"
